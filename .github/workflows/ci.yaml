name: Full CI/CD pipeline

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false

  schedule:
    - cron: '1 0 */3 * *'
  push:
    branches:
      - master
      - upgrade/*
    paths:
      - .github/workflows/ci.yaml
      - inference/**
      - test/**
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - inference/**
      - test/*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, amd64, linux, 2xlarge-extra]
    timeout-minutes: 600
    steps:
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        uses: canonical/action-tmate@main
        with:
          detached: true
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Snapcraft pack
        id: snapcraft
        uses: canonical/craft-actions/snapcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f
        with:
          path: inference/
      - name: Save CI artifacts
        uses: actions/upload-artifact@v7
        with:
          path: inference/${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          name: rocm-inference-${{ github.run_id }}
          overwrite: true

  install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get CI artifacts
        uses: actions/download-artifact@v8
        with:
          name: rocm-inference-${{ github.run_id }}
          path: artifacts/
      - name: Installation test
        run: |
          sudo snap install --dangerous --devmode artifacts/*.snap

  test-emulated:
    needs: [build, install]
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Get CI artifacts
        uses: actions/download-artifact@v8
        with:
          name: rocm-inference-${{ github.run_id }}
          path: artifacts/
      - name: Get rocjitsu
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:baioc/rocjitsu
          sudo apt-get update
          sudo apt-get install -y rocjitsu
          sudo snap install --dangerous --devmode artifacts/*.snap
      - name: Test on emulated GPU
        shell: bash
        run: |
          set -euo pipefail

          ROCM=/snap/rocm-inference/current/opt/rocm
          export ROCM_PATH="$ROCM"
          export HIP_PATH="$ROCM"
          export LD_LIBRARY_PATH="$ROCM/lib:$ROCM/lib/llvm/lib:$ROCM/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH:-}"

          rocjitsu --config /usr/share/rocjitsu/configs/gfx1151.json -- \
            "$ROCM/bin/hipblaslt-bench" --verify -r f32_r \
          | awk '
            !/\[0\]|f32_r/ { print; next }
            {
              split($0,t,",");
              printf "%-17s %-15s %-10s %-14s %-14s\n",t[37],t[38],t[39],t[40],t[41]
            }'

  upload:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [install, test-emulated]
    runs-on: ubuntu-latest
    steps:
      - name: Get CI artifacts
        uses: actions/download-artifact@v8
        with:
          name: rocm-inference-${{ github.run_id }}
          path: artifacts/
      - name: Release to snap store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload -v artifacts/*.snap --release latest/edge

  test-hardware:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: upload
    continue-on-error: true  # Testflinger can be flaky, so don't fail the pipeline
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Submit TF job
        id: testflinger
        uses: canonical/testflinger/.github/actions/submit@main
        with:
          job-path: test/testflinger.yaml
          poll: true
          client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
      - name: Download test artifacts
        if: ${{ always() && steps.testflinger.outputs.id != '' }}
        run: |
          for attempt in {1..10}; do
            echo "Attempt $attempt: Downloading artifacts..."
            if testflinger artifacts ${{ steps.testflinger.outputs.id }}; then
              echo "Successfully downloaded artifacts"
              break
            else
              if [ $attempt -eq 10 ]; then
                echo "Failed to download artifacts after 10 attempts"
                exit 1
              fi
              echo "Failed to download artifacts, retrying in 10 seconds..."
              sleep 10
            fi
          done
      - name: Save test artifacts
        if: ${{ always() && steps.testflinger.outputs.id != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts.tgz
          if-no-files-found: error
          name: testflinger-artifacts-${{ steps.testflinger.outputs.id }}
