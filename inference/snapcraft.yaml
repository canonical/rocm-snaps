name: rocm-inference
summary: ROCm components for AI / ML / LLM inference
description: |
  A reusable snap package with prebuilt ROCm / HIP parts for AI inference.

license: MIT

# NOTE: upstream source tag is derived from this version
version: '10.0'
base: core26

# therock is amd64-only
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

confinement: strict

package-repositories:
  - type: apt
    url: https://stable.repo.amd.com/rocm/core/packages/ubuntu2604
    suites: [stable]
    components: [main]
    architectures: [amd64]
    key-id: D0F004A0025A1145C7807FCD0701EAC4D5E02107

slots:
  runtime:
    interface: content
    content: rocm-inference-10-0-2604
    read:
      - $SNAP/opt/rocm

parts:
  common:
    plugin: nil
    stage-packages:
      - amdrocm-sysdeps${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-base${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-runtime${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-amdsmi${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-math-common${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-profiler-base${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-blas-host${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-rand-host${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-solver-host${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-sparse-host${SNAPCRAFT_PROJECT_VERSION}
      - libatomic1
      - libquadmath0
      - python3
    organize:
      opt/rocm/core-${SNAPCRAFT_PROJECT_VERSION}: opt/rocm

  dev:
    after: [common]
    plugin: nil
    stage-packages:
      - amdrocm-llvm${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-llvm-dev${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-runtime-dev${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-blas-dev${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-hipblas-common-dev${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-rand-dev${SNAPCRAFT_PROJECT_VERSION}
      - amdrocm-ccl-dev${SNAPCRAFT_PROJECT_VERSION}
    organize:
      opt/rocm/core-${SNAPCRAFT_PROJECT_VERSION}: opt/rocm

  gfx1151:
    after: [common, dev]
    plugin: nil
    stage-packages:
      - amdrocm-blas${SNAPCRAFT_PROJECT_VERSION}-gfx1151
      - amdrocm-rand${SNAPCRAFT_PROJECT_VERSION}-gfx1151
      - amdrocm-solver${SNAPCRAFT_PROJECT_VERSION}-gfx1151
      - amdrocm-sparse${SNAPCRAFT_PROJECT_VERSION}-gfx1151
    organize:
      opt/rocm/core-${SNAPCRAFT_PROJECT_VERSION}: opt/rocm

  gfx1100:
    after: [common, dev]
    plugin: nil
    stage-packages:
      - amdrocm-blas${SNAPCRAFT_PROJECT_VERSION}-gfx1100
      - amdrocm-rand${SNAPCRAFT_PROJECT_VERSION}-gfx1100
      - amdrocm-solver${SNAPCRAFT_PROJECT_VERSION}-gfx1100
      - amdrocm-sparse${SNAPCRAFT_PROJECT_VERSION}-gfx1100
    organize:
      opt/rocm/core-${SNAPCRAFT_PROJECT_VERSION}: opt/rocm

  gfx950:
    after: [common, dev]
    plugin: nil
    stage-packages:
      - amdrocm-blas${SNAPCRAFT_PROJECT_VERSION}-gfx950
      - amdrocm-rand${SNAPCRAFT_PROJECT_VERSION}-gfx950
      - amdrocm-solver${SNAPCRAFT_PROJECT_VERSION}-gfx950
      - amdrocm-sparse${SNAPCRAFT_PROJECT_VERSION}-gfx950
    organize:
      opt/rocm/core-${SNAPCRAFT_PROJECT_VERSION}: opt/rocm
