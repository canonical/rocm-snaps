name: llama-cpp
summary: llama.cpp using the latest ROCm stack
description: |
  Snap package for llama.cpp with ROCm HIP backend from TheRock.

license: MIT

version: b9763+hip7.13

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

base: core24

grade: devel
confinement: devmode

environment:
  ROCM_PATH: $SNAP/opt/rocm
  HIP_PATH: $SNAP/opt/rocm
  PATH: $SNAP/usr/local/bin:$SNAP/opt/rocm/bin:$SNAP/opt/rocm/lib/llvm/bin:$PATH
  LD_LIBRARY_PATH: $SNAP/usr/local/lib:$SNAP/usr/local/bin:$SNAP/opt/rocm/lib:$SNAP/opt/rocm/lib/llvm/lib:$SNAP/opt/rocm/lib/rocm_sysdeps/lib:$LD_LIBRARY_PATH

apps:
  llama-cli:
    command: usr/local/bin/llama-cli
    plugs:
      - home
      - accel
      - process-control
      - network
  llama-server:
    command: usr/local/bin/llama-server
    plugs:
      - home
      - accel
      - process-control
      - network
      - network-bind

parts:
  rocm-libs:
    source: https://github.com/ROCm/TheRock.git
    source-tag: therock-7.13
    source-depth: 1
    source-submodules: []
    plugin: nil

    build-packages:
      - automake
      - bison
      - ccache
      - cmake
      - curl
      - flex
      - g++
      - gfortran
      - git
      - git-lfs
      - libegl1-mesa-dev
      - libtool
      - make
      - ninja-build
      - patchelf
      - pkg-config
      - python3-dev
      - python3-venv
      - texinfo
      - xxd

    stage-packages:
      - libatomic1
      - libquadmath0

    override-pull: |
      set -e
      craftctl default
      python3 build_tools/fetch_sources.py \
        --no-include-system-projects \
        --no-include-compilers \
        --no-include-debug-tools \
        --no-include-rocm-libraries \
        --no-include-rocm-systems \
        --no-include-ml-frameworks \
        --no-include-media-libs \
        --no-include-iree-libs \
        --no-include-math-libraries \
        --source-sets base rocm-systems rocm-libraries

    override-build: |
      set -e

      # install python deps
      python3 -m venv .venv
      source .venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt

      # fetch prebuilt toolchain (trusted=yes should be fine because of TLS)
      echo 'deb [arch=amd64 trusted=yes] https://repo.amd.com/rocm/packages/ubuntu2404 stable main' \
        | tee /etc/apt/sources.list.d/rocm.list
      apt-get update
      apt-get install -y amdrocm-llvm-dev7.13

      # populate build/compiler/amd-llvm from the deb install, then mark it
      # prebuilt so CMake skips configure/build/stage of amd-llvm
      echo "Substituting AMD deb LLVM into build/compiler/amd-llvm/stage"
      AMD_LLVM_STAGE="$CRAFT_PART_BUILD/build/compiler/amd-llvm/stage"
      mkdir -p "$AMD_LLVM_STAGE/lib/llvm"
      cp -a /opt/rocm/core-7.13/lib/llvm/. "$AMD_LLVM_STAGE/lib/llvm/"
      touch "$CRAFT_PART_BUILD/build/compiler/amd-llvm/stage.prebuilt"

      # ditto for amd-comgr and hipcc
      echo "Substituting AMD deb comgr into build/compiler/amd-comgr/stage"
      COMGR_STAGE="$CRAFT_PART_BUILD/build/compiler/amd-comgr/stage"
      mkdir -p "$COMGR_STAGE/lib" "$COMGR_STAGE/include" "$COMGR_STAGE/lib/cmake"
      cp -a /opt/rocm/core-7.13/lib/libamd_comgr.so* "$COMGR_STAGE/lib/" 2>/dev/null || true
      cp -a /opt/rocm/core-7.13/include/amd_comgr "$COMGR_STAGE/include/"
      cp -a /opt/rocm/core-7.13/lib/cmake/amd_comgr "$COMGR_STAGE/lib/cmake/"
      touch "$CRAFT_PART_BUILD/build/compiler/amd-comgr/stage.prebuilt"
      echo "Substituting AMD deb hipcc into build/compiler/hipcc/stage"
      HIPCC_STAGE="$CRAFT_PART_BUILD/build/compiler/hipcc/stage"
      mkdir -p "$HIPCC_STAGE/bin"
      cp -a /opt/rocm/core-7.13/bin/hipcc* "$HIPCC_STAGE/bin/" 2>/dev/null || true
      cp -a /opt/rocm/core-7.13/bin/hipconfig* "$HIPCC_STAGE/bin/" 2>/dev/null || true
      touch "$CRAFT_PART_BUILD/build/compiler/hipcc/stage.prebuilt"

      # and also for sysdeps, except these will be rebuilt
      echo "Staging rocm_sysdeps alongside lib/llvm"
      mkdir -p "$AMD_LLVM_STAGE/lib/rocm_sysdeps"
      cp -a /opt/rocm/core-7.13/lib/rocm_sysdeps/. "$AMD_LLVM_STAGE/lib/rocm_sysdeps/"

      # then remove system package to make sure it doesn't interfere with the build
      apt-get remove -y amdrocm-llvm-dev7.13
      apt-get autoremove -y

      # avoid breaking builds on newer compilers
      export CFLAGS="${CFLAGS:-} -Wno-error"

      cmake --fresh -B build -G Ninja . \
        -DTHEROCK_ENABLE_ALL=OFF \
        -DTHEROCK_ENABLE_CORE_RUNTIME=ON \
        -DTHEROCK_ENABLE_HIP_RUNTIME=ON \
        -DTHEROCK_ENABLE_BLAS=ON \
        -DhipBLASLt_CMAKE_ARGS="-DCMAKE_CXX_FLAGS=-isystem${CRAFT_PART_BUILD}/build/core/clr/dist/include" \
        -DTHEROCK_ENABLE_ROCWMMA=ON \
        -DTHEROCK_AMDGPU_FAMILIES='gfx90a;gfx942;gfx1030;gfx110X-all;gfx115X-all;gfx1200;gfx1201' \
        -DTHEROCK_AMDGPU_DIST_BUNDLE_NAME='gfx90a_gfx942_gfx1030_gfx110X-all_gfx115X-all_gfx1200_gfx1201' \
        -DBUILD_TESTING=OFF \
        -DTHEROCK_BUILD_TESTING=OFF \
        -DTHEROCK_BUNDLE_SYSDEPS=ON

      export CMAKE_BUILD_PARALLEL_LEVEL=$CRAFT_PARALLEL_BUILD_COUNT
      cmake --build build --target artifact-blas artifact-rocwmma
      cmake --build build --target dist-rocm

      mkdir -p "$CRAFT_PART_INSTALL/opt/rocm"
      cp -a build/dist/rocm/. "$CRAFT_PART_INSTALL/opt/rocm/"

  llama-cpp:
    after:
      - rocm-libs
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b9763
    source-depth: 1
    plugin: nil

    build-packages:
      - build-essential
      - cmake
      - git
      - libcurl4-openssl-dev
      - libssl-dev
      - ninja-build
      - pkg-config
      - python3

    stage-packages:
      - ca-certificates
      - libcurl4t64
      - libgomp1
      - libssl3t64
      - libstdc++6

    override-build: |
      set -e

      export ROCM_PATH="$CRAFT_STAGE/opt/rocm"
      export HIP_PATH="$ROCM_PATH"
      export HIPCXX="$ROCM_PATH/lib/llvm/bin/clang++"
      export PATH="$ROCM_PATH/bin:$ROCM_PATH/lib/llvm/bin:$PATH"
      export LD_LIBRARY_PATH="$ROCM_PATH/lib:$ROCM_PATH/lib/llvm/lib:${LD_LIBRARY_PATH:-}"

      cmake -S . -B build -G Ninja \
        -DLLAMA_OPENSSL=ON \
        -DLLAMA_BUILD_UI=ON \
        -DLLAMA_USE_PREBUILT_UI=ON \
        -DBUILD_SHARED_LIBS=ON \
        -DGGML_CPU=ON \
        -DGGML_NATIVE=OFF \
        -DGGML_BACKEND_DL=ON \
        -DGGML_HIP=ON \
        -DGPU_TARGETS='gfx90a;gfx942;gfx1030;gfx1100;gfx1151;gfx11-generic;gfx1200;gfx1201' \
        -DCMAKE_BUILD_TYPE=Release \
        -DGGML_BUILD_TESTS=OFF \
        -DGGML_BUILD_EXAMPLES=OFF \
        -DCMAKE_PREFIX_PATH="$ROCM_PATH" \
        -DCMAKE_INSTALL_PREFIX=/usr/local

      cmake --build build --config Release -j${CRAFT_PARALLEL_BUILD_COUNT}
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install build
