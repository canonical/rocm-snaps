job_queue: 202604-38596

global_timeout: 14400
output_timeout: 3600

provision_data:
  distro: desktop-26-04-uefi

test_data:
  test_cmds: |
    set -e -o pipefail

    mkdir -p artifacts

    echo '------------ DUT INFO ------------'
    echo "DEVICE_IP: $DEVICE_IP"
    ssh ubuntu@$DEVICE_IP '
      echo "HOSTNAME: $HOSTNAME"
      echo
      lscpu | egrep -i "architecture|model name"
      echo
      lspci -nnk | grep -i AMD
      echo
      free -h
      echo
      df -h --sync -T -x tmpfs
      echo
      grep -e VERSION /etc/os-release
      echo
      uname -a
    ' | tee artifacts/sysinfo.log

    echo '------------- SETUP --------------'
    ssh ubuntu@$DEVICE_IP '
      set -e
      sudo apt-get update
      sudo apt-get upgrade -y
      sudo snap refresh
      sudo usermod -a -G lxd $USER
      sudo usermod -a -G render,video $USER
    ' 2>&1 | tee artifacts/setup.log

    echo '---------- INVENTORY ------------'
    ssh ubuntu@$DEVICE_IP '
      dpkg-query -W
      echo
      snap list
    ' | tee artifacts/inventory.log

    echo '------------- TESTS --------------'
    ssh ubuntu@$DEVICE_IP '
      set -e

      sudo snap install rocm-inference --channel=latest/edge
      snap info rocm-inference

      ROCM=/snap/rocm-inference/current/opt/rocm
      export ROCM_PATH="$ROCM"
      export HIP_PATH="$ROCM"
      export LD_LIBRARY_PATH="$ROCM/lib:$ROCM/lib/llvm/lib:$ROCM/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH:-}"

      "$ROCM/bin/hipblaslt-bench" --verify -r f32_r \
      | grep -e "\[0\]" -e "f32_r" | cut -d"," -f 37-41 | column -t -s","
    ' 2>&1 | tee artifacts/test.log

    echo '----------- ARTIFACTS ------------'
    find artifacts || echo "No artifacts generated"
